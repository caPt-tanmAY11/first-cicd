name: Express API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build-and-push:
    name: Build and Push Docker Image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set lowercase image name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
  
  deploy:
    name: Deploy to EC2 through SSM
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: first-cicd-production
      cancel-in-progress: false

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::612671145923:role/first-cicd-github-actions-role
          aws-region: ap-south-1
          role-session-name: first-cicd-deploy-${{ github.run_id }}
          allowed-account-ids: "612671145923"

      - name: Deploy image through Systems Manager
        env:
          INSTANCE_ID: i-0dd958de33899ff6e
          IMAGE_NAME: ${{ needs.build-and-push.outputs.image_name }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          command -v aws >/dev/null
          command -v jq >/dev/null

          # Prepare the deployment script that EC2 will execute.
          cat > deploy-script.sh <<'SCRIPT'
          #!/bin/sh
          set -eu

          IMAGE="__IMAGE_NAME__:__IMAGE_TAG__"
          CONTAINER_NAME="first-cicd"
          PORT_MAPPING="80:3000"

          OLD_IMAGE=$(docker inspect --format '{{.Config.Image}}' \
            "$CONTAINER_NAME" 2>/dev/null || true)

          echo "Pulling $IMAGE"
          docker pull "$IMAGE"

          echo "Replacing the application container"
          docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true

          if ! docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            -p "$PORT_MAPPING" \
            "$IMAGE"; then

            echo "New container failed to start"
            docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true

            if [ -n "$OLD_IMAGE" ]; then
              echo "Rolling back to $OLD_IMAGE"
              docker run -d \
                --name "$CONTAINER_NAME" \
                --restart unless-stopped \
                -p "$PORT_MAPPING" \
                "$OLD_IMAGE"
            fi

            exit 1
          fi

          # Wait up to 30 seconds for the new application.
          HEALTHY=0
          ATTEMPT=1

          while [ "$ATTEMPT" -le 15 ]; do
            if curl --fail --silent \
              http://127.0.0.1/health >/dev/null; then
              HEALTHY=1
              break
            fi

            sleep 2
            ATTEMPT=$((ATTEMPT + 1))
          done

          if [ "$HEALTHY" -ne 1 ]; then
            echo "Health check failed"
            docker logs --tail 100 "$CONTAINER_NAME" || true
            docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true

            if [ -n "$OLD_IMAGE" ]; then
              echo "Rolling back to $OLD_IMAGE"

              docker run -d \
                --name "$CONTAINER_NAME" \
                --restart unless-stopped \
                -p "$PORT_MAPPING" \
                "$OLD_IMAGE"

              ROLLBACK_HEALTHY=0
              ATTEMPT=1

              while [ "$ATTEMPT" -le 10 ]; do
                if curl --fail --silent \
                  http://127.0.0.1/health >/dev/null; then
                  ROLLBACK_HEALTHY=1
                  break
                fi

                sleep 2
                ATTEMPT=$((ATTEMPT + 1))
              done

              if [ "$ROLLBACK_HEALTHY" -eq 1 ]; then
                echo "Rollback health check succeeded"
              else
                echo "Rollback health check failed"
                docker logs --tail 100 "$CONTAINER_NAME" || true
              fi
            fi

            exit 1
          fi

          echo "Deployment succeeded: /health returned HTTP 200"
          docker image prune -f --filter "until=168h" || true
          SCRIPT

          # Insert the exact image name and commit SHA.
          sed -i \
            -e "s|__IMAGE_NAME__|${IMAGE_NAME}|g" \
            -e "s|__IMAGE_TAG__|${IMAGE_TAG}|g" \
            deploy-script.sh

          # Encode the script as SSM command parameters.
          jq -n --rawfile script deploy-script.sh \
            '{commands: [$script]}' > ssm-parameters.json

          # Send the command to our EC2 instance.
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "first-cicd deploy ${IMAGE_TAG}" \
            --parameters file://ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          # Wait for EC2 to finish executing the deployment.
          STATUS="Pending"

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            case "$STATUS" in
              Success)
                break
                ;;
              Failed|Cancelled|TimedOut|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated|InvalidPlatform)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,StatusDetails:StatusDetails,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
                  --output json || true
                exit 1
                ;;
            esac

            sleep 5
          done

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment timed out. Last status: $STATUS"

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query '{Status:Status,StatusDetails:StatusDetails,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
              --output json || true

            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text
